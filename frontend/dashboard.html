<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="dashboard">

    <h1>📊 Dashboard</h1>

    <div class="stats">

        <div class="card">
            <h3>Total Projects</h3>
            <p id="projects">0</p>
        </div>

        <div class="card">
            <h3>Total Tasks</h3>
            <p id="tasks">0</p>
        </div>

        <div class="card">
            <h3>Completed</h3>
            <p id="completed">0</p>
        </div>

        <div class="card">
            <h3>Pending</h3>
            <p id="pending">0</p>
        </div>

    </div>

    <div class="task-form">

        <h2>Create Task</h2>

        <input type="text" id="title" placeholder="Task Title">
        <input type="text" id="description" placeholder="Description">
        <input type="text" id="project" placeholder="Project ID">

        <button onclick="createTask()">➕ Create Task</button>

    </div>

</div>

<script src="script.js"></script>
</body>
</html>
